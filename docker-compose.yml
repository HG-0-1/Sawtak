services:
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mc2026}
      POSTGRES_USER: ${POSTGRES_USER:-mc2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mc2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mc2026:mc2026@postgres:5432/mc2026
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node apps/api/dist/scripts/migrate.js && node apps/api/dist/scripts/seed.js && node apps/api/dist/server.js"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  postgres-data:
